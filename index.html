<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>房租收益RWA - rentoken.world</title>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <link rel="stylesheet" href="components/ui/Card.css">
  <link rel="stylesheet" href="components/ui/Button.css">
  <link rel="stylesheet" href="components/ui/Input.css">
  <link rel="stylesheet" href="components/ui/KLineChart.css">
  <script src="components/ui/KLineChart.js"></script>
  <style>
    .investor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px 28px;
      align-items: stretch;
      margin: 0 0 24px 0;
    }
    .investor-col.left, .investor-col.right {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    @media (max-width: 900px) {
      .investor-grid {
        grid-template-columns: 1fr;
        gap: 18px 0;
      }
    }
    .tab-select {
      font-size: 1.08rem;
      border-radius: 8px;
      padding: 8px 18px;
      min-width: 120px;
      background: #2e2a4f;
      color: #b993ff;
      border: 1.5px solid #6a5cff44;
      box-shadow: 0 2px 8px 0 rgba(106,92,255,0.08);
      outline: none;
      transition: border 0.18s, box-shadow 0.18s;
      appearance: none;
      -webkit-appearance: none;
      margin: 0 0 0 4px;
    }
    .tab-select:focus {
      border: 1.5px solid #b993ff;
      box-shadow: 0 0 0 2px #b993ff33;
    }
    .tab-select option {
      background: #2e2a4f;
      color: #b993ff;
    }
    @media (max-width: 700px) {
      .nav-tabs {
        gap: 4px;
        overflow-x: auto;
        flex-wrap: nowrap;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 2px;
      }
      .nav-tabs::-webkit-scrollbar {
        display: none;
      }
      .tab-btn {
        min-width: 90px;
        font-size: 1rem;
        padding: 8px 10px;
        border-radius: 8px 8px 0 0;
        flex: 1 0 auto;
        white-space: nowrap;
      }
    }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      height: 100%;
      margin: 0;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      background: linear-gradient(135deg, #2e2a4f 0%, #6a5cff 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      min-width: 320px;
    }
    /* 其余全局和业务样式保留 */
    .navbar {
      width: 100%;
      background: rgba(46,42,79,0.97);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      box-sizing: border-box;
      box-shadow: 0 4px 18px 0 rgba(106,92,255,0.10);
      height: 80px;
      font-size: 1.15rem;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 1.5px;
    }
    .nav-logo img {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: #fff2;
      object-fit: contain;
      box-shadow: 0 2px 8px 0 rgba(106,92,255,0.10);
    }
    .nav-tabs {
      display: flex;
      gap: 16px;
    }
    .tab-content {
      flex: 1 1 auto;
      width: 100%;
      max-width: 95vw;
      margin: 24px auto;
      background: rgba(255,255,255,0.06);
      border-radius: 28px;
      box-shadow: 0 6px 36px 0 rgba(106,92,255,0.13);
      padding: 32px 20px 24px 20px;
      min-height: 0;
      height: calc(100vh - 200px);
      overflow: auto;
      transition: all 0.2s;
      box-sizing: border-box;
    }
    .tab-panel {
      display: none;
      animation: fadein 0.3s;
    }
    .tab-panel.active {
      display: block;
    }
    h2 {
      margin-top: 0;
      font-size: 2rem;
      color: #b993ff;
      letter-spacing: 1px;
    }
    ul {
      padding-left: 20px;
      font-size: 1.1rem;
      line-height: 2;
      color: #e0e0ff;
    }
    .footer {
      width: 100%;
      text-align: center;
      color: #b993ff;
      font-size: 1rem;
      letter-spacing: 1px;
      margin: 32px 0 8px 0;
    }
    .result {
      color: #b993ff;
      font-size: 1.05rem;
      margin-top: 4px;
    }
    .risk-list {
      margin: 0;
      padding-left: 18px;
      color: #ffb3b3;
      font-size: 1rem;
    }
    .actions {
      display: flex;
      gap: 32px;
      justify-content: center;
      margin-top: 18px;
    }
    .chart-svg {
      width: 100%;
      min-height: 140px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="tokenYieldData.js"></script>
  <script src="components/legacyUtils.js"></script>
  <script src="components/ui/Card.js"></script>
  <script src="components/ui/Button.js"></script>
  <script src="components/ui/Input.js"></script>
  <script src="components/Navbar.js"></script>
  <script src="components/InvestorPanel.js"></script>
  <script src="components/SpvPanel.js"></script>
  <script src="components/OwnerPanel.js"></script>
  <script src="components/Footer.js"></script>
  <script src="components/App.js"></script>
  <script>
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(window.App));
  </script>
</body>
</html>
